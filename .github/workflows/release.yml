name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - name: Match tag and plugin version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw .codex-plugin/plugin.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match plugin version $version."
          }
      - run: npm run verify
      - run: npm run build:release
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/tmcra-codex-$version.zip" \
            "release/tmcra-codex-$version.zip.sha256" \
            "release/tmcra-codex-release.json" \
            --verify-tag \
            --generate-notes \
            --prerelease
