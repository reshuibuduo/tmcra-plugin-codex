name: Plugin contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - name: Verify Codex and Claude Code contracts
        env:
          TMCRA_TEST_POWERSHELL: ${{ runner.os == 'Windows' && 'pwsh' || '' }}
        run: npm run verify
      - name: Build self-contained release archive
        shell: pwsh
        run: |
          npm run build:release
          $archive = Join-Path "${{ github.workspace }}" "release/tmcra-codex-latest.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "TMCRA Codex release archive was not created."
          }
